name: vs_chat_example
description: "vs_chat_flutter in VISITOR mode: a public app with no backend, talking to chat-service with a publishable key."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  flutter_screenutil: ^5.9.3
  vs_chat_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
